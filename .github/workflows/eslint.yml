name: Extension checks

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    eslint:
        name: Lint, tests, and version checks
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: "24"
                  cache: npm

            - name: Check version consistency
              run: |
                  command -v jq >/dev/null
                  ./harddiskledng.sh check-version

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Lint
              env:
                  SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
              run: >-
                  npx eslint .
                  --format @microsoft/eslint-formatter-sarif
                  --output-file eslint-results.sarif

            - name: Upload ESLint results
              if: ${{ !cancelled() && hashFiles('eslint-results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
              with:
                  sarif_file: eslint-results.sarif
                  wait-for-processing: true

    shexli:
        name: Shexli review report
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  python-version: "3.13"

            - name: Install Shexli
              run: python -m pip install --no-cache-dir "tree-sitter<0.26" shexli

            - name: Analyze extension
              shell: bash
              run: |
                  set +e
                  shexli "$GITHUB_WORKSPACE/harddiskledNG@lauinger-clan.de" 2>&1 | tee shexli-output.txt
                  status=${PIPESTATUS[0]}

                  {
                    echo "## Shexli results"
                    echo '```text'
                    cat shexli-output.txt
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

                  exit "$status"
